[package]
name = "mado-world-time"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono     = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz  = "0.10"
fontdue    = "0.9"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
